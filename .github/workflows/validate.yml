name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix:
    name: nix checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install nix
        uses: cachix/install-nix-action@v31

      - name: flake check
        run: nix flake check

      - name: alejandra format check
        run: nix run --inputs-from . nixpkgs#alejandra -- --check .

      - name: statix lint
        run: nix run --inputs-from . nixpkgs#statix -- check .

  agents:
    name: agent render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node agents/config/check.mjs
      - id: pin
        run: node -e 'console.log("revision="+require("./agents/config/lock.json").revision)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tomasmota/agents
          ref: ${{ steps.pin.outputs.revision }}
          path: central-source
      - run: AGENTS_SOURCE="$PWD/central-source" bash agents/config/manage.sh --check
