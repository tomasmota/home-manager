name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix:
    name: nix checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install nix
        uses: cachix/install-nix-action@v31

      # Evaluates every system's checks but builds only the runner's (x86_64-linux).
      - name: flake check
        run: nix flake check --all-systems -L
